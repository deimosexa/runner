<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coin Runner</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:100%;height:100%;max-width:1000px;background:#78c8ff;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;color:white;font-weight:800;font-size:18px;text-shadow:2px 2px #000;pointer-events:none}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:white;text-shadow:3px 3px #000;pointer-events:auto}
#box{background:rgba(0,0,0,.72);padding:25px;border-radius:18px;max-width:90%}
#box h1{margin:0 0 10px;font-size:38px}
#box p{margin:8px 0;font-size:18px}
button{margin-top:14px;border:0;border-radius:12px;padding:13px 28px;font-size:20px;font-weight:800;cursor:pointer}
#controls{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.ctrl{pointer-events:auto;width:72px;height:60px;border-radius:16px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:white;font-size:28px;font-weight:bold}
#jump{width:110px}
@media(min-width:700px){#controls{display:none}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud"><span id="score">Coins: 0</span><span id="lives">Lives: 3</span></div>
<div id="msg">
  <div id="box">
    <h1>COIN RUNNER</h1>
    <p>Collect coins, dodge enemies, and reach the flag!</p>
    <p>Keyboard: ← → to move • Space to jump</p>
    <button id="start">PLAY</button>
  </div>
</div>
<div id="controls">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="jump">JUMP</button>
  <button class="ctrl" id="right">▶</button>
</div>
</div>
<script>
(() => {
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score');
  const livesEl=document.getElementById('lives');
  const msg=document.getElementById('msg');
  const box=document.getElementById('box');
  const start=document.getElementById('start');

  let W=0,H=0,scale=1,playing=false,won=false,gameOver=false;
  let score=0,lives=3,keys={left:false,right:false};
  let player,platforms,coins,enemies,flag,camera=0,last=0;

  function resize(){
    W=window.innerWidth; H=window.innerHeight;
    const d=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.floor(W*d); canvas.height=Math.floor(H*d);
    ctx.setTransform(d,0,0,d,0,0);
    scale=Math.max(0.75,Math.min(1.35,W/900));
  }
  window.addEventListener('resize',resize); resize();

  function reset(){
    score=0;lives=3;camera=0;
    player={x:70,y:300,w:32,h:42,vx:0,vy:0,onGround:false,inv:0};
    platforms=[
      {x:0,y:430,w:700,h:30},{x:790,y:430,w:500,h:30},
      {x:1380,y:430,w:650,h:30},{x:2120,y:430,w:800,h:30},
      {x:480,y:330,w:150,h:22},{x:930,y:325,w:150,h:22},
      {x:1160,y:275,w:130,h:22},{x:1510,y:330,w:160,h:22},
      {x:1770,y:280,w:150,h:22},{x:2300,y:330,w:170,h:22},
      {x:2580,y:270,w:150,h:22}
    ];
    coins=[
      {x:180,y:385},{x:350,y:385},{x:540,y:285},{x:860,y:385},
      {x:1000,y:280},{x:1210,y:230},{x:1450,y:385},{x:1570,y:285},
      {x:1810,y:235},{x:1950,y:385},{x:2370,y:285},{x:2640,y:225},
      {x:2780,y:385}
    ];
    enemies=[
      {x:560,y:388,w:34,h:42,vx:1.2,min:450,max:650},
      {x:1080,y:388,w:34,h:42,vx:-1.3,min:820,max:1240},
      {x:1660,y:388,w:34,h:42,vx:1.4,min:1400,max:1980},
      {x:2450,y:388,w:34,h:42,vx:-1.5,min:2140,max:2880}
    ];
    flag={x:2820,y:350,w:12,h:80};
    updateHud();
  }

  function updateHud(){scoreEl.textContent='Coins: '+score;livesEl.textContent='Lives: '+lives}
  function show(title,text,button){
    box.innerHTML='<h1>'+title+'</h1><p>'+text+'</p><button id="start">'+button+'</button>';
    msg.style.display='flex';
    document.getElementById('start').addEventListener('click',begin);
  }
  function begin(){
    reset(); playing=true;won=false;gameOver=false;msg.style.display='none';last=performance.now();requestAnimationFrame(loop);
  }

  function jump(){
    if(playing && player.onGround){player.vy=-12;player.onGround=false}
  }

  function press(dir,on){keys[dir]=on}
  [['left','left'],['right','right']].forEach(([id,dir])=>{
    const b=document.getElementById(id);
    ['touchstart','mousedown'].forEach(e=>b.addEventListener(e,x=>{x.preventDefault();press(dir,true)}));
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(e=>b.addEventListener(e,x=>{x.preventDefault();press(dir,false)}));
  });
  const jb=document.getElementById('jump');
  ['touchstart','mousedown'].forEach(e=>jb.addEventListener(e,x=>{x.preventDefault();jump()}));
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;
    if(e.key==='ArrowRight'||e.key==='d')keys.right=true;
    if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();jump()}
  });
  window.addEventListener('keyup',e=>{
    if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
    if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
  });
  start.addEventListener('click',begin);

  function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
  function update(dt){
    const p=player;
    p.vx=(keys.right?4.2:0)+(keys.left?-4.2:0);
    p.vy+=.55*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.onGround=false;
    for(const q of platforms){
      if(p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>=q.y&&p.y+p.h<=q.y+q.h+14&&p.vy>=0){
        p.y=q.y-p.h;p.vy=0;p.onGround=true;
      }
    }
    if(p.y>H+120){loseLife();return}
    for(const c of coins){
      if(!c.got && Math.abs((p.x+p.w/2)-c.x)<25 && Math.abs((p.y+p.h/2)-c.y)<30){c.got=true;score++;updateHud()}
    }
    for(const e of enemies){
      e.x+=e.vx*dt;if(e.x<e.min||e.x>e.max)e.vx*=-1;
      if(p.inv<=0&&hit(p,e)){loseLife();return}
    }
    if(p.inv>0)p.inv-=dt;
    if(hit(p,flag)){playing=false;won=true;show('YOU WIN!','You collected '+score+' coins. Nice run!','PLAY AGAIN');return}
    camera=Math.max(0,Math.min(2200,p.x-W*.35));
  }
  function loseLife(){
    lives--;updateHud();
    if(lives<=0){playing=false;gameOver=true;show('GAME OVER','You collected '+score+' coins. Try again!','RESTART');return}
    player.x=Math.max(50,player.x-180);player.y=250;player.vy=0;player.inv=100;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#78c8ff';ctx.fillRect(0,0,W,H);
    // clouds
    ctx.fillStyle='rgba(255,255,255,.8)';
    for(let i=0;i<6;i++){let x=(i*300-camera*.15)%1200-100,y=70+(i%3)*55;ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.arc(x+28,y-12,32,0,Math.PI*2);ctx.arc(x+60,y,24,0,Math.PI*2);ctx.fill()}
    ctx.save();ctx.translate(-camera,0);
    for(const q of platforms){ctx.fillStyle='#43a047';ctx.fillRect(q.x,q.y,q.w,q.h);ctx.fillStyle='#795548';ctx.fillRect(q.x,q.y+8,q.w,q.h-8)}
    for(const c of coins){if(c.got)continue;ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.arc(c.x,c.y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b8860b';ctx.lineWidth=3;ctx.stroke()}
    for(const e of enemies){ctx.fillStyle='#d32f2f';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='white';ctx.fillRect(e.x+7,e.y+8,7,7);ctx.fillRect(e.x+20,e.y+8,7,7);ctx.fillStyle='black';ctx.fillRect(e.x+9,e.y+10,3,3);ctx.fillRect(e.x+22,e.y+10,3,3)}
    ctx.fillStyle='#eee';ctx.fillRect(flag.x,flag.y,flag.w,flag.h);ctx.fillStyle='#e53935';ctx.beginPath();ctx.moveTo(flag.x+12,flag.y);ctx.lineTo(flag.x+55,flag.y+15);ctx.lineTo(flag.x+12,flag.y+30);ctx.fill();
    const p=player;
    if(p.inv<=0||Math.floor(p.inv/8)%2===0){ctx.fillStyle='#1565c0';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#ffcc80';ctx.fillRect(p.x+7,p.y+4,p.w-14,18);ctx.fillStyle='#222';ctx.fillRect(p.x+11,p.y+10,4,4);ctx.fillRect(p.x+21,p.y+10,4,4);ctx.fillStyle='#263238';ctx.fillRect(p.x+4,p.y+p.h-7,10,7);ctx.fillRect(p.x+19,p.y+p.h-7,10,7)}
    ctx.restore();
  }
  function loop(t){
    if(!playing)return;
    const dt=Math.min(2,(t-last)/16.67);last=t;
    update(dt);draw();if(playing)requestAnimationFrame(loop);
  }
  reset();
})();
</script>
</body>
</html>
