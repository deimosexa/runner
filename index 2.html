<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Coin Runner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:14px}.wrap{width:min(1050px,100%)}h1{margin:4px 0 10px;font-size:32px}.game{position:relative;border:1px solid #334155;border-radius:18px;overflow:hidden;background:#8ed0ff}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap}.hud span{background:#07101dcc;border:1px solid #ffffff33;border-radius:10px;padding:8px 10px;font-weight:800}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}.buttons button{min-height:50px;min-width:100px;border:1px solid #334155;border-radius:12px;background:#172235;color:#fff;font-weight:900;font-size:16px;touch-action:none}.buttons .jump{background:#fff;color:#07101d}.hint{text-align:center;color:#94a3b8;font-size:13px;margin-top:8px}
</style></head><body><div class="wrap"><h1>COIN RUNNER</h1><div class="game"><canvas id="c" width="1280" height="720"></canvas><div class="hud"><span id="co">COINS 0/15</span><span id="li">LIVES 3</span><span id="st">REACH THE FLAG</span></div></div><div class="buttons"><button id="l">◀ LEFT</button><button id="j" class="jump">▲ JUMP</button><button id="r">RIGHT ▶</button><button id="re">RESTART</button></div><div class="hint">A/D or ←/→ to move • Space/W/↑ to jump</div></div>
<script>
(()=>{const c=document.getElementById('c'),g=c.getContext('2d'),W=1280,H=720,world=3600;let p,cs,es,keys={l:0,r:0},jump=0,cam=0,life=3,got=0,over=0;
const plats=[{x:0,y:610,w:650,h:110},{x:790,y:500,w:390,h:45},{x:1300,y:400,w:360,h:45},{x:1780,y:540,w:430,h:45},{x:2340,y:450,w:380,h:45},{x:2840,y:530,w:400,h:45},{x:3290,y:430,w:310,h:290}];
const pts=[[150,545],[310,545],[510,545],[870,435],[1050,435],[1380,335],[1530,335],[1870,475],[2070,475],[2440,385],[2600,385],[2940,465],[3100,465],[3380,365],[3500,365]];
const ep=[{x:400,y:570,a:80,b:610,v:2},{x:900,y:455,a:800,b:1140,v:1.6},{x:1400,y:355,a:1310,b:1620,v:1.8},{x:1900,y:495,a:1800,b:2160,v:2.1},{x:2470,y:405,a:2350,b:2690,v:1.7},{x:3000,y:485,a:2850,b:3200,v:2}];
function reset(){p={x:80,y:540,w:42,h:64,vx:0,vy:0,on:0,face:1};cs=pts.map(q=>({x:q[0],y:q[1],got:0,t:Math.random()*6}));es=ep.map(q=>({...q,w:46,h:40,d:1}));life=3;got=0;over=0;cam=0;document.getElementById('st').textContent='REACH THE FLAG';hud();requestAnimationFrame(loop)}
function hud(){co.textContent='COINS '+got+'/'+cs.length;li.textContent='LIVES '+life}
function lose(){life--;hud();if(life<1){over=1;st.textContent='GAME OVER — RESTART'}else{p.x=80;p.y=540;p.vx=p.vy=0;st.textContent='WATCH OUT!'}}
function update(){if(over)return;p.vx=(keys.r?6:0)-(keys.l?6:0);if(p.vx)p.face=Math.sign(p.vx);p.vy+=.72;p.x+=p.vx;p.y+=p.vy;p.on=0;for(const q of plats)if(p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>=q.y&&p.y+p.h<=q.y+25&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.on=1}if(jump){jump=0;if(p.on){p.vy=-16;p.on=0}}if(p.y>850){lose();return}for(const q of cs)if(!q.got&&Math.hypot(p.x+p.w/2-q.x,p.y+p.h/2-q.y)<34){q.got=1;got++;hud()}for(const e of es){e.x+=e.v*e.d;if(e.x<e.a||e.x>e.b)e.d*=-1;if(p.x<e.x+e.w-6&&p.x+p.w>e.x+6&&p.y<e.y+e.h&&p.y+p.h>e.y+6){lose();return}}if(p.x>3450){over=1;st.textContent='YOU WIN! '+got+'/'+cs.length+' COINS';}cam=Math.max(0,Math.min(world-W,p.x-W*.35))}
function draw(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#72c8ff');sky.addColorStop(.65,'#e2f6ff');sky.addColorStop(.651,'#82c65c');sky.addColorStop(1,'#4b903d');g.fillStyle=sky;g.fillRect(0,0,W,H);g.save();g.translate(-cam,0);
g.fillStyle='#fff9';for(let i=0;i<14;i++){let x=i*300+70,y=70+(i%4)*45;g.beginPath();g.arc(x,y,30,0,7);g.arc(x+35,y+5,23,0,7);g.arc(x-28,y+7,22,0,7);g.fill()}
for(const q of plats){g.fillStyle='#765036';g.fillRect(q.x,q.y,q.w,q.h);g.fillStyle='#42a64b';g.fillRect(q.x,q.y-8,q.w,15)}
for(const q of cs)if(!q.got){q.t+=.08;g.fillStyle='#ffd43b';g.beginPath();g.arc(q.x,q.y,15,0,7);g.fill();g.fillStyle='#fff2a0';g.fillRect(q.x-4,q.y-9,5,8)}
for(const e of es){g.fillStyle='#b93643';g.fillRect(e.x,e.y,e.w,e.h);g.fillStyle='#fff';g.fillRect(e.x+8,e.y+10,9,9);g.fillRect(e.x+29,e.y+10,9,9);g.fillStyle='#111';g.fillRect(e.x+11,e.y+13,4,4);g.fillRect(e.x+32,e.y+13,4,4)}
g.fillStyle='#263238';g.fillRect(3490,280,10,330);g.fillStyle='#ff4f5a';g.beginPath();g.moveTo(3500,290);g.lineTo(3590,320);g.lineTo(3500,350);g.fill();
g.fillStyle='#2769d7';g.fillRect(p.x,p.y,p.w,p.h);g.fillStyle='#ffd0a6';g.beginPath();g.arc(p.x+21,p.y+15,15,0,7);g.fill();g.fillStyle='#202638';g.fillRect(p.x+5,p.y+1,33,12);g.fillStyle='#183d82';g.fillRect(p.x+6,p.y+52,11,12);g.fillRect(p.x+27,p.y+52,11,12);g.restore()}
function loop(){update();draw();requestAnimationFrame(loop)}
function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=1};['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>keys[k]=0))}
bind('l','l');bind('r','r');j.onpointerdown=e=>{e.preventDefault();jump=1};re.onclick=reset;
onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w','A','D','W'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.l=1;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.r=1;if(['ArrowUp',' ','w','W'].includes(e.key)&&!e.repeat)jump=1};onkeyup=e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.l=0;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.r=0};reset()})()
</script></body></html>
